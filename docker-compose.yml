# Backend + Caddy (automatic HTTPS) for Hetzner.
# Caddy terminates TLS and reverse-proxies to the Express backend.
#
#   docker compose up -d --build
#
# Requires a .env file in this directory (copy from .env.example).
services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # AUD-013 CR-067: the PRIVATE exam-PDF store MUST live on a persistent
      # volume (below), never the container's writable layer — otherwise a
      # rebuild/recreate would erase every migrated exam PDF. The startup
      # preflight refuses a non-absolute EXAM_PDF_DIR in production.
      EXAM_PDF_DIR: /app/examPdfs
      BOARD_FILES_DIR: /app/boardFiles
      GUIDES_DIR: /app/guide-videos
      # Curriculum sources are the bytes every textbook CITATION is pinned to, so
      # they must outlive a rebuild: the startup preflight refuses a non-absolute
      # CURRICULUM_DIR in production for exactly the same reason as EXAM_PDF_DIR.
      CURRICULUM_DIR: /app/lessonAssets
    # tini as PID 1 reaps zombie Chromium processes and forwards signals so the
    # browser shuts down cleanly (avoids stale profile locks on restart).
    init: true
    # Chromium (whatsapp-web.js) needs more shared memory than the 64MB default.
    shm_size: "512mb"
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000" # internal only; Caddy is the public entrypoint
    volumes:
      - uploads:/app/uploads # legacy public uploads (kept until migration relocates them)
      - exampdfs:/app/examPdfs # AUD-013 CR-067: persist PRIVATE exam PDFs across rebuilds
      - materials:/app/materials # persist study materials across rebuilds
      - assignments:/app/assignments # persist homework tasks + student submissions across rebuilds
      - videos:/app/videos # persist uploaded MP4/WebM lesson videos across rebuilds
      - boardfiles:/app/boardFiles # persist private board images across rebuilds
      - guidevideos:/app/guide-videos # persist public "how to use" guide videos across rebuilds
      - wa_auth:/app/.wwebjs_auth # persist the linked WhatsApp session
      - live_journal:/app/live-journal # durable write-ahead journal for live whiteboard sessions
      - curriculum:/app/lessonAssets # persist textbook sources + page crops across rebuilds
      # Read-only view of the nightly database backups, so the Health page can say
      # when the last one actually ran (BACKUP_LOG_DIR in controllers/healthController).
      - /root/backups/mongo:/app/backups-mongo:ro
    networks:
      - web

  # AUD-017: mutating scheduled work is isolated from HTTP replicas. Leases and
  # idempotency still make multiple worker replicas safe.
  worker:
    build: .
    command: ["node", "worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      EXAM_PDF_DIR: /app/examPdfs
      CURRICULUM_DIR: /app/lessonAssets
      RUN_BACKGROUND_JOBS: "false"
      WHATSAPP_WEB_ENABLED: "false"
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - exampdfs:/app/examPdfs
      - materials:/app/materials
      - assignments:/app/assignments
      - videos:/app/videos
      - curriculum:/app/lessonAssets
    networks:
      - web

  # Self-hosted MongoDB, moved off Atlas on 2026-09-16: the Atlas shared tier
  # throttled server<->database traffic to ~97 KB/s, which made every page that
  # moved real data slow.
  #
  # MongoDB 7.0, NOT 8.x, on purpose. This host runs Linux kernel 7.0, and MongoDB
  # 8.0+ is broken on kernels >= 6.19 (SERVER-121912: its TCMalloc violates the
  # rseq ABI). Measured here: 8.0 refuses to start, 8.2 starts and then segfaults
  # after 26 s of load. 7.0 ran a 3-minute parallel write/transaction stress test
  # clean. It is also the server version the app's driver (bundled with Mongoose
  # 7.8) officially supports. Move to 8.x only once a build passes that test.
  #
  # INTERNAL ONLY: no published port, so only the backend and worker on the `web`
  # network can reach it — never the internet.
  #
  # A one-node REPLICA SET, not a plain server: the app uses transactions
  # (services/mongoUnitOfWork, 17 call sites) and MongoDB refuses a transaction
  # on a standalone. Auth is on; with a replica set that needs the keyfile, which
  # lives only on the server (./mongo-keyfile, 400, owned by uid 999) and is kept
  # out of git and out of the image by .gitignore / .dockerignore.
  #
  # Memory is capped: the box has 3.7 GB and WhatsApp's Chromium sessions share
  # it. 0.5 GB of cache is far more than the ~64 MB of data needs.
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command:
      - --replSet=rs0
      - --bind_ip_all
      - --keyFile=/etc/mongo/keyfile
      - --wiredTigerCacheSizeGB=0.5
    mem_limit: 1g
    # Loopback ONLY (127.0.0.1), never 0.0.0.0: reachable from the server itself —
    # an SSH tunnel for MongoDB Compass — and still invisible from the internet.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/etc/mongo/keyfile:ro
      # Nightly dumps land here, on the host, for the off-server copy to pick up.
      - /root/backups/mongo:/backups
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The backend's own public hostname (no scheme), e.g. 5.75.1.2.sslip.io
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # persists issued certificates
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  uploads:
  exampdfs:
  materials:
  assignments:
  videos:
  boardfiles:
  guidevideos:
  wa_auth:
  live_journal:
  curriculum:
  caddy_data:
  caddy_config:
  mongo_data: # the database itself — never `docker volume rm` this
