# Backend + Caddy (automatic HTTPS) for Hetzner.
# Caddy terminates TLS and reverse-proxies to the Express backend.
#
#   docker compose up -d --build
#
# Requires a .env file in this directory (copy from .env.example).
services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # AUD-013 CR-067: the PRIVATE exam-PDF store MUST live on a persistent
      # volume (below), never the container's writable layer — otherwise a
      # rebuild/recreate would erase every migrated exam PDF. The startup
      # preflight refuses a non-absolute EXAM_PDF_DIR in production.
      EXAM_PDF_DIR: /app/examPdfs
    # tini as PID 1 reaps zombie Chromium processes and forwards signals so the
    # browser shuts down cleanly (avoids stale profile locks on restart).
    init: true
    # Chromium (whatsapp-web.js) needs more shared memory than the 64MB default.
    shm_size: "512mb"
    expose:
      - "5000" # internal only; Caddy is the public entrypoint
    volumes:
      - uploads:/app/uploads # legacy public uploads (kept until migration relocates them)
      - exampdfs:/app/examPdfs # AUD-013 CR-067: persist PRIVATE exam PDFs across rebuilds
      - materials:/app/materials # persist study materials across rebuilds
      - assignments:/app/assignments # persist homework tasks + student submissions across rebuilds
      - videos:/app/videos # persist uploaded MP4/WebM lesson videos across rebuilds
      - wa_auth:/app/.wwebjs_auth # persist the linked WhatsApp session
      - live_journal:/app/live-journal # durable write-ahead journal for live whiteboard sessions
    networks:
      - web

  # AUD-017: mutating scheduled work is isolated from HTTP replicas. Leases and
  # idempotency still make multiple worker replicas safe.
  worker:
    build: .
    command: ["node", "worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      EXAM_PDF_DIR: /app/examPdfs
      RUN_BACKGROUND_JOBS: "false"
      WHATSAPP_WEB_ENABLED: "false"
    init: true
    volumes:
      - uploads:/app/uploads
      - exampdfs:/app/examPdfs
      - materials:/app/materials
      - assignments:/app/assignments
      - videos:/app/videos
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The backend's own public hostname (no scheme), e.g. 5.75.1.2.sslip.io
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # persists issued certificates
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  uploads:
  exampdfs:
  materials:
  assignments:
  videos:
  wa_auth:
  live_journal:
  caddy_data:
  caddy_config:
